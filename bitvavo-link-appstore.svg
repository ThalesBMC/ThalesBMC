<svg xmlns="http://www.w3.org/2000/svg" width="304" height="70" viewBox="0 0 304 70">
  <style>
    :root { --card:#f5f5f7; --line:rgba(0,0,0,.06); --link:#0066cc; --gap:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --card:#1c1c1e; --line:rgba(255,255,255,.08); --link:#2997ff; --gap:#0d1117; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .f { opacity:0; animation: fade .9s ease .1s forwards; }
    @keyframes fade { to { opacity:1; } }
  </style>
  <g class="f">
    <path d="M0,0 V69 H275 A28,28 0 0 0 303,41 V0 Z" fill="var(--card)"/>
    <path d="M0,69 H275 A28,28 0 0 0 303,41 V0" fill="none" stroke="var(--line)"/>
    <rect x="0" y="0" width="303" height="0.75" fill="var(--gap)"/>
    <rect x="0" y="0" width="0.75" height="70" fill="var(--gap)"/>
    <text x="14" y="37" font-size="18" font-weight="500" fill="var(--link)">App Store ›</text>
  </g>
</svg>
