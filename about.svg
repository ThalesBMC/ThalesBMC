<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230"><style>
    :root { --fg:#1d1d1f; --sub:#6e6e73; --card:#f5f5f7; --line:rgba(0,0,0,.06); --link:#0066cc; --pill:#f5f5f7; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f5f5f7; --sub:#a1a1a6; --card:#1c1c1e; --line:rgba(255,255,255,.08); --link:#2997ff; --pill:#1c1c1e; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .a { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    
  </style>
  <g class="a"><text x="450" y="70" text-anchor="middle" font-size="44" font-weight="700" letter-spacing="-1.2" fill="var(--fg)">About.</text></g><g class="a" style="animation-delay:0.20s"><text x="450" y="120" text-anchor="middle" font-size="21" fill="var(--sub)">Five years building crypto products, from wallets to DeFi to exchanges.</text></g><g class="a" style="animation-delay:0.32s"><text x="450" y="152" text-anchor="middle" font-size="21" fill="var(--sub)">Today I'm on the trading team at Bitvavo, where I take features</text></g><g class="a" style="animation-delay:0.44s"><text x="450" y="184" text-anchor="middle" font-size="21" fill="var(--sub)">from the spec to the numbers after launch, on mobile and web.</text></g></svg>