<svg xmlns="http://www.w3.org/2000/svg" width="220" height="70" viewBox="0 0 220 70">
  <style>
    :root { --card:#f5f5f7; --line:rgba(0,0,0,.06); --link:#0066cc; }
    @media (prefers-color-scheme: dark) {
      :root { --card:#1c1c1e; --line:rgba(255,255,255,.08); --link:#2997ff; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .f { opacity:0; animation: fade .9s ease .1s forwards; }
    @keyframes fade { to { opacity:1; } }
  </style>
  <g class="f">
    <path d="M1,0 V41 A28,28 0 0 0 29,69 H220 V0 Z" fill="var(--card)"/>
    <path d="M1,0 V41 A28,28 0 0 0 29,69 H220" fill="none" stroke="var(--line)"/>
    <text x="36" y="37" font-size="18" font-weight="500" fill="var(--link)">Web app ›</text>
  </g>
</svg>
