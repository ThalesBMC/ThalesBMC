<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270">
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity=".22"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="1" y="1" width="438" height="268" rx="28"/></clipPath>
  </defs>
  <style>
    :root { --fg:#1d1d1f; --sub:#6e6e73; --card:#f5f5f7; --line:rgba(0,0,0,.06); --link:#0066cc; --pill:#f5f5f7; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f5f5f7; --sub:#a1a1a6; --card:#1c1c1e; --line:rgba(255,255,255,.08); --link:#2997ff; --pill:#1c1c1e; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .a { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    
  </style>
  <g class="a" style="animation-delay:0.4s">
    <rect x="1" y="1" width="438" height="268" rx="28" fill="var(--card)" stroke="var(--line)"/>
    <rect x="1" y="1" width="438" height="268" fill="url(#glow)" clip-path="url(#c)"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" begin="1.3s" repeatCount="indefinite"/></rect>
    <text x="36" y="62" font-size="13" font-weight="600" letter-spacing="1.2" fill="#16a34a">DEFI · NEAR FOUNDATION</text>
    <text x="36" y="104" font-size="30" font-weight="700" letter-spacing="-.8" fill="var(--fg)">Fluxus Finance.</text>
    <text x="36" y="150" font-size="18" fill="var(--sub)">The first NEAR-native</text><text x="36" y="176" font-size="18" fill="var(--sub)">yield optimizer.</text>
    <text x="36" y="232" font-size="18" font-weight="500" fill="var(--link)">Read the story ›</text>
  </g>
</svg>